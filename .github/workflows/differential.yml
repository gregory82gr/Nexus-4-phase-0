name: Differential tests

# Every example in tests/examples runs through GHDL (the oracle) and through the
# NEXUS-4 kernel loaded straight from index.html. They must agree delta cycle by
# delta cycle. The runner and GHDL version are pinned because GHDL's
# --trace-signals output is a debugging format, calibrated for GHDL 4.1.
#
# The assembler in index.html is compared the same way with GNU binutils for RISC-V
# (Ubuntu 24.04 ships binutils 2.42): identical bytes, symbols and disassembly.
# The ISA reference model is compared with Spike, the RISC-V reference simulator, commit
# by commit, and runs the official riscv-tests (rv32ui). Spike is built from source at a
# pinned commit and cached; riscv-tests are fetched at a pinned commit.
# The processor core in VHDL (rtl/) is compared with the ISA model on every committed
# instruction and on its cycle count, on GHDL and on the NEXUS-4 kernel.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  differential:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install GHDL, GNU binutils for RISC-V and dtc (the oracles; Spike runs dtc)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ghdl binutils-riscv64-unknown-elf device-tree-compiler
          ghdl --version
          riscv64-unknown-elf-as --version | head -1

      - name: Restore Spike (the ISA oracle) from the cache
        id: spike
        uses: actions/cache@v6
        with:
          path: ~/spike
          key: spike-ubuntu-24.04-7d1ee24bcc3308557e1c6a45c579db9ca5e97dd9

      - name: Build Spike at its pinned commit (only when it is not cached; about 8 minutes)
        if: steps.spike.outputs.cache-hit != 'true'
        run: |
          git clone --quiet https://github.com/riscv-software-src/riscv-isa-sim.git /tmp/riscv-isa-sim
          cd /tmp/riscv-isa-sim
          git checkout --quiet 7d1ee24bcc3308557e1c6a45c579db9ca5e97dd9
          git submodule update --init --depth 1
          mkdir build && cd build
          ../configure --prefix="$HOME/spike" > /dev/null
          make -j"$(nproc)" > /dev/null
          make install > /dev/null
          "$HOME/spike/bin/spike" --help 2>&1 | head -1

      - name: Fetch the official riscv-tests at their pinned commit
        run: |
          git init --quiet /tmp/riscv-tests
          git -C /tmp/riscv-tests fetch --quiet --depth 1 https://github.com/riscv-software-src/riscv-tests.git 3df703cd52d5f0d8224e3c50bf03c6cb70efff98
          git -C /tmp/riscv-tests checkout --quiet FETCH_HEAD

      - name: Check that index.html carries the current examples and assembler samples (the pages open these copies)
        run: node tools/embed-examples.mjs --check

      - name: Run differential tests
        run: node tools/differential.mjs

      - name: Check the course (examples, highlighted cycles, drill answers computed by the kernel)
        run: node tools/course-check.mjs

      - name: Run mutation checks (the tests must catch a broken kernel)
        run: node tools/mutations.mjs

      - name: Check the assembler against GNU as (bytes, symbols, error cases, disassembly)
        run: node tools/asm-check.mjs

      - name: Run assembler mutation checks (the GNU comparison must catch a broken assembler)
        run: node tools/asm-mutations.mjs

      - name: Check the ISA reference model against Spike (commits, traps, deliberate differences)
        run: SPIKE="$HOME/spike/bin/spike" node tools/isa-check.mjs

      - name: Run the official riscv-tests rv32ui (assembled by NEXUS-4 and by GNU, run on the model)
        run: RISCV_TESTS=/tmp/riscv-tests node tools/riscv-tests.mjs

      - name: Run ISA model mutation checks (Spike and riscv-tests must catch a broken model)
        run: SPIKE="$HOME/spike/bin/spike" RISCV_TESTS=/tmp/riscv-tests node tools/isa-mutations.mjs

      - name: Check the processor core against the reference model (every commit and the cycle count; GHDL and the NEXUS-4 kernel)
        run: RISCV_TESTS=/tmp/riscv-tests node tools/core-check.mjs

      - name: Run core mutation checks (the model comparison must catch a broken core)
        run: RISCV_TESTS=/tmp/riscv-tests node tools/core-mutations.mjs

      - name: Check the assembly Help (encodings, cycles, examples on the model, messages, differences)
        run: node tools/help-check.mjs

      - name: Check fault injection against GHDL (saboteurs; the kernel's deposits must settle as GHDL does)
        run: node tools/fault-check.mjs

      - name: Fault campaign on the core (upsets in architectural state must agree with the ISA model)
        run: node tools/fault-campaign.mjs
